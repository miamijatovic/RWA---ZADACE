<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>Novi paragrafi</title>
  <script>
    function dodajParagraf() {
      let novi = document.createElement("p");
      novi.textContent = "Ovo je novi paragraf.";
      let mjesto = document.getElementById("thisLocation");
      mjesto.parentNode.insertBefore(novi, mjesto.nextSibling);
    }
  </script>
</head>
<body>
  <p><a href="#" onclick="dodajParagraf()">Kliknite ovdje da dodate novi paragraf tekst</a></p>
  <p id="thisLocation">Novi paragrafi teksta će se pojaviti ispod</p>
  <p>Ovo je defaultni prvi paragraf teksta</p>
</body>
</html>
