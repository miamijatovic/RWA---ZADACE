<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Anonimna funkcija s unosom</title>
</head>
<body>
  <h1>Unesi broj</h1>
  <input type="text" id="brojInput" placeholder="Upiši broj ovdje" />
  <button onclick="provjeri()">Provjeri</button>

  <p id="rezultat"></p>

  <script>
    let funkcija = function(x) {
      if (typeof x === 'number' && !isNaN(x)) {
        return x * x;
      } else {
        return "Pogreška: nije broj";
      }
    };

    function provjeri() {
      let unos = document.getElementById('brojInput').value;
      let broj = Number(unos);  // pretvori u broj (ako može)
      let rezultat = funkcija(broj);
      document.getElementById('rezultat').textContent = 'Rezultat: ' + rezultat;
    }
  </script>
</body>
</html>
