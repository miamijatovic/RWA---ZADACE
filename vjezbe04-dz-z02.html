<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Parni brojevi</title>
</head>
<body>
  <script>
    for (let i = 1; i <= 100; i++) {
      if (i % 2 === 0) {
        console.log(i + " -> " + i * i);
        document.write(i + " -> " + (i * i) + "<br>");
      }
    }
  </script>
</body>
</html>
