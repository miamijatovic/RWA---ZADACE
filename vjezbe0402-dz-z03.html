<!DOCTYPE html>
<html lang="hr">
<head><meta charset="UTF-8"><title>Ocjena alert</title></head>
<body>
  <form>
    <input type="number" id="ocjena" min="1" max="5" placeholder="Unesi ocjenu">
    <button type="button" onclick="provjeri()">Provjeri</button>
  </form>

  <script>
    function provjeri() {
      let o = document.getElementById("ocjena").value;
      let poruke = ["", "Nedovoljan", "Dovoljan", "Dobar", "Vrlo dobar", "Odličan"];
      alert(poruke[o] || "Nevažeća ocjena!");
    }
  </script>
</body>
</html>
