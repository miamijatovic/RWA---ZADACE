<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Polja</title>
</head>
<body>
  <script>
    let polje = new Array(1,2,3,4,7,8,5,6,9,55,12,4,85);

    document.write("Duljina polja: " + polje.length + "<br>");
    document.write("Sortirano opadajuće: " + [...polje].sort((a,b)=>b-a) + "<br>");
    let rastuce = [...polje].sort((a,b)=>a-b);
    document.write("Sortirano rastuće: " + rastuce + "<br>");

    rastuce.pop();
    document.write("Bez zadnjeg člana: " + rastuce + "<br>");

    rastuce.push(19, 22);
    document.write("Dodani članovi: " + rastuce + "<br>");

    let polje2 = ["Banana", "Orange", "Apple", "Mango"];
    let polje_final = rastuce.concat(polje2);
    document.write("Spojeno polje: " + polje_final + "<br>");
  </script>
</body>
</html>
