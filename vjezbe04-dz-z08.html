<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Filtriranje niza</title>
</head>
<body>
  <script>
    var arr = ['Ovo', 'je', 'My', 'prvi', 'komad', 'OF', 'JAVASCRIPT', 'koda', 'Koji', 'je', 'proradio'];

    function filtriraj(arr) {
      let novo = arr.filter(x => /[A-Z]/.test(x) || x.length >= 5);
      return novo;
    }

    document.write(filtriraj(arr).join(", "));
  </script>
</body>
</html>
